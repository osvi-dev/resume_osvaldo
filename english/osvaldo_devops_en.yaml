design:
  theme: sb2nov
  page:
    size: us-letter
    top_margin: 1.5cm
    bottom_margin: 1.5cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_footer: false
    show_top_note: false
  typography:
    font_size:
      name: 24pt 
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
  header:
    alignment: center
    space_below_name: 0.3cm
    space_below_connections: 0.2cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: false
      separator: "•"
      space_between_connections: 0.3cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.3cm
    space_below: 0.2cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.25cm
    space_between_text_based_entries: 0.15cm
  entries:
    date_and_location_width: 5.5cm
    side_space: 0cm
    space_between_columns: 0.2cm
    allow_page_break: false
    highlights:
      bullet: "•"
      space_left: 0.4cm
      space_above: 0.05cm
      space_between_items: 0.05cm
      space_between_bullet_and_text: 0.3em

locale:
  language: english

settings:
